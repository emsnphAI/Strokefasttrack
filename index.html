<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBvqL8Di40e2ETN3NfA_aOW_aW7fPD0HRA",
      authDomain: "cpg-stroke.firebaseapp.com",
      projectId: "cpg-stroke",
      storageBucket: "cpg-stroke.firebasestorage.app",
      messagingSenderId: "691025642570",
      appId: "1:691025642570:web:7d7f41cb8387017ea792b3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    window.currentUserEmail = "";
    window.currentActiveDocId = localStorage.getItem('activeCaseId') || null;

    document.getElementById('timeLkw').value = new Date().toISOString().slice(0, 16);
    document.getElementById('timeFMC').value = new Date().toTimeString().slice(0,5);
    document.getElementById('dash-date').innerText = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });

    let tempEvalData = null; 
    window.activeDocId = null;
    window.allCases = [];
    window.selectedCaseToClose = null;
    let unsubscribeSnapshot = null; // เพิ่มตัวแปรควบคุมการดึงข้อมูล

    // ================= 🗺️ LEAFLET MAP CONFIG =================
    let map = null;
    let markers = {};
    const ambIcon = L.divIcon({
        html: '<i class="fas fa-ambulance fa-lg text-red-500 drop-shadow-[0_0_6px_rgba(239,68,68,0.8)]"></i>',
        className: 'bg-transparent',
        iconSize: [24, 24],
        iconAnchor: [12, 12]
    });

    function initMap() {
        if (!map) {
            const placeholder = document.getElementById('map-placeholder');
            if(placeholder) placeholder.style.display = 'none';
            map = L.map('mainMap').setView([13.814036, 100.037293], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
        }
    }

    window.setVsTimeToNow = function() {
        const now = new Date();
        const vsTimeInput = document.getElementById('vs_log_time');
        if(vsTimeInput) vsTimeInput.value = now.toTimeString().slice(0, 5);
    };

    window.checkAppMode = function() {
        const assessForm = document.getElementById('strokeForm');
        const repeatVsForm = document.getElementById('repeat-vs-form');
        const activeBanner = document.getElementById('active-case-banner');

        if (window.currentActiveDocId) {
            if(assessForm) assessForm.classList.add('hidden');
            if(repeatVsForm) repeatVsForm.classList.remove('hidden');
            if(activeBanner) activeBanner.classList.remove('hidden');

            const currentRec = window.allCases?.find(c => c.id === window.currentActiveDocId);
            if (currentRec) {
                document.getElementById('currentPatientTitle').innerText = `${currentRec.name || 'ไม่ระบุชื่อ'} (${currentRec.onset ? 'Onset: ' + currentRec.onset : ''})`;
                renderVitalsLogs(currentRec.vitals_timeline || []);
            }
            window.setVsTimeToNow();
        } else {
            if(assessForm) assessForm.classList.remove('hidden');
            if(repeatVsForm) repeatVsForm.classList.add('hidden');
            if(activeBanner) activeBanner.classList.add('hidden');
        }
    };

    window.newPatientAssessment = function() {
        if (confirm("ต้องการเริ่มประเมินผู้ป่วยรายใหม่ใช่หรือไม่? (เคสเดิมจะยังอยู่ในระบบ)")) {
            localStorage.removeItem('activeCaseId');
            window.currentActiveDocId = null;
            window.activeDocId = null;
            document.getElementById('strokeForm').reset();
            window.checkAppMode();
        }
    };

    window.selectCaseToUpdate = function(docId) {
        window.currentActiveDocId = docId;
        window.activeDocId = docId;
        localStorage.setItem('activeCaseId', docId);
        window.switchTab('assess');
        window.checkAppMode();
    };

    window.saveVitalsLog = async function() {
        if (!window.currentActiveDocId) {
            alert("ไม่พบเคสที่กำลังดำเนินการ");
            return;
        }

        const logTime = document.getElementById('vs_log_time').value || new Date().toTimeString().slice(0, 5);
        const ge = document.getElementById('log_gcs_e').value;
        const gv = document.getElementById('log_gcs_v').value;
        const gm = document.getElementById('log_gcs_m').value;

        let gcsFormatted = '-';
        if (ge || gv || gm) {
            const eVal = ge || '-';
            const vVal = gv || '-';
            const mVal = gm || '-';
            const total = (ge && gv && gm) ? (parseInt(ge) + parseInt(gv) + parseInt(gm)) : '';
            gcsFormatted = `E${eVal}V${vVal}M${mVal}${total ? ' (' + total + ')' : ''}`;
        }

        const newEntry = {
            time: logTime,
            bp: document.getElementById('log_bp').value || '-',
            hr: document.getElementById('log_hr').value || '-',
            rr: document.getElementById('log_rr').value || '-',
            spo2: document.getElementById('log_spo2').value || '-',
            dtx: document.getElementById('log_dtx').value || '-',
            gcs_e: ge || '-',
            gcs_v: gv || '-',
            gcs_m: gm || '-',
            gcs_display: gcsFormatted,
            note: document.getElementById('log_note').value || '-',
            loggedAt: new Date().toISOString()
        };

        try {
            const caseRef = doc(db, "stroke_patients", window.currentActiveDocId);
            await updateDoc(caseRef, {
                vitals_timeline: arrayUnion(newEntry)
            });

            alert(`บันทึกสัญญาณชีพรอบเวลา ${logTime} น. เรียบร้อย`);
            
            document.getElementById('log_bp').value = '';
            document.getElementById('log_hr').value = '';
            document.getElementById('log_rr').value = '';
            document.getElementById('log_spo2').value = '';
            document.getElementById('log_dtx').value = '';
            document.getElementById('log_gcs_e').value = '';
            document.getElementById('log_gcs_v').value = '';
            document.getElementById('log_gcs_m').value = '';
            document.getElementById('log_note').value = '';
            window.setVsTimeToNow();

        } catch (err) {
            console.error(err);
            alert("เกิดข้อผิดพลาดในการบันทึกสัญญาณชีพ");
        }
    };

    function renderVitalsLogs(timeline) {
        const container = document.getElementById('vitalsLogTable');
        if (!container) return;
        if (!timeline || timeline.length === 0) {
            container.innerHTML = '<p class="text-gray-400 text-center py-1.5 italic text-[11px]">ยังไม่มีบันทึกสัญญาณชีพเพิ่มเติม</p>';
            return;
        }

        container.innerHTML = timeline.map((item, idx) => {
            const gcsText = item.gcs_display || (item.gcs ? item.gcs : '-');
            return `
                <div class="border-l-2 border-blue-500 pl-2.5 py-1 bg-slate-50 rounded-r text-gray-700 shadow-sm mb-1.5">
                    <div class="flex justify-between font-bold text-blue-900 text-xs">
                        <span>ครั้งที่ ${idx + 1} (${item.time} น.)</span>
                        <span class="text-red-700 font-mono">${gcsText} | BP: ${item.bp}</span>
                    </div>
                    <div class="text-[10px] text-gray-500 mt-0.5">
                        HR: ${item.hr} | RR: ${item.rr} | SpO2: ${item.spo2}% | DTX: ${item.dtx}
                    </div>
                    ${item.note && item.note !== '-' ? `<div class="text-[10px] text-gray-600 mt-0.5 bg-white p-1 rounded border border-gray-200">Note: ${item.note}</div>` : ''}
                </div>
            `;
        }).reverse().join('');
    }

    window.switchTab = function(tab) {
        ['dashboard', 'assess', 'action', 'history', 'document'].forEach(t => {
            const el = document.getElementById(`${t}-view`);
            const btn = document.getElementById(`tab-${t}`);
            if(el) el.classList.add('hidden');
            if(btn) btn.classList.remove('active');
        });
        const targetEl = document.getElementById(`${tab}-view`);
        const targetBtn = document.getElementById(`tab-${tab}`);
        if(targetEl) targetEl.classList.remove('hidden');
        if(targetBtn) targetBtn.classList.add('active');
        window.scrollTo(0, 0);

        if (tab === 'dashboard') {
            setTimeout(() => {
                initMap();
                if(map) map.invalidateSize();
            }, 100);
        } else if (tab === 'assess') {
            window.checkAppMode();
        }
    }

    window.toggleNeedleTime = function() {
        const checkboxes = document.querySelectorAll('input[name="er_outcome"]:checked');
        const hasRtpa = Array.from(checkboxes).some(cb => cb.value === 'rtpa');
        const needleDiv = document.getElementById('needleTimeDiv');
        if(hasRtpa) {
            needleDiv.classList.remove('hidden');
        } else {
            needleDiv.classList.add('hidden');
            document.getElementById('m_needle').value = '';
        }
    }

    // ================= 🔐 AUTHENTICATION LOGIC =================
    window.handleLogin = async function(e) {
        e.preventDefault();
        const u = document.getElementById('loginUsername').value.trim();
        const p = document.getElementById('loginPassword').value;
        const errBox = document.getElementById('loginError');
        const btn = document.getElementById('btnLoginSubmit');

        errBox.classList.add('hidden');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1.5"></i> กำลังตรวจสอบสิทธิ์...';
        btn.disabled = true;

        const email = u.includes('@') ? u : `${u}@nkp-als.local`;

        try {
            await signInWithEmailAndPassword(auth, email, p);
        } catch (error) {
            errBox.innerText = "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
            errBox.classList.remove('hidden');
            btn.innerHTML = '<span>เข้าสู่ระบบปฏิบัติการ</span> <i class="fas fa-arrow-right text-xs"></i>';
            btn.disabled = false;
        }
    }

    window.handleLogout = async function() {
        if(confirm("ต้องการออกจากระบบใช่หรือไม่?")) {
            await signOut(auth);
        }
    }

    onAuthStateChanged(auth, (user) => {
        const loginView = document.getElementById('login-view');
        const mainApp = document.getElementById('main-app');
        const userBadge = document.getElementById('userBadge');
        const btn = document.getElementById('btnLoginSubmit');

        if (user) {
            window.currentUserEmail = user.email;
            loginView.classList.add('hidden');
            mainApp.classList.remove('hidden');
            const displayUser = user.email.replace('@nkp-als.local', '');
            if(userBadge) userBadge.innerHTML = `<i class="fas fa-user-circle mr-1 text-emerald-400"></i> ${displayUser}`;
            
            // 👉 เริ่มดึงข้อมูล (Real-time listener) เมื่อตรวจสอบ Login เสร็จแล้วเท่านั้น
            startListeningData();

            window.switchTab('dashboard');
        } else {
            window.currentUserEmail = "";
            loginView.classList.remove('hidden');
            mainApp.classList.add('hidden');
            document.getElementById('loginForm').reset();
            btn.innerHTML = '<span>เข้าสู่ระบบปฏิบัติการ</span> <i class="fas fa-arrow-right text-xs"></i>';
            btn.disabled = false;
            
            // ยกเลิกการดึงข้อมูลเมื่อ Logout
            if (unsubscribeSnapshot) {
                unsubscribeSnapshot();
                unsubscribeSnapshot = null;
            }
        }
    });

    // ================= 🩺 CLINICAL FLOW =================
    window.openNewCase = function() {
        window.activeDocId = null;
        window.currentActiveDocId = null;
        localStorage.removeItem('activeCaseId');
        document.getElementById('strokeForm').reset();
        document.getElementById('interventionForm').reset();
        window.switchTab('assess');
        window.checkAppMode();
    }

    window.evaluatePatient = function() {
        const name = document.getElementById('patientName').value;
        if(!name) { alert('กรุณากรอกชื่อผู้ป่วย'); return; }

        const ccInput = document.getElementById('patientCC').value || '';
        const piInput = document.getElementById('patientPI').value || '';
        const lkwInput = document.getElementById('timeLkw').value;
        const onset = document.getElementById('timeOnset').value || 'ไม่ระบุ';
        const fmcInput = document.getElementById('timeFMC').value;

        const isBeFastPositive = ['b','e','f','a','s'].some(id => document.getElementById(`befast_${id}`).checked);
        const isLvo = document.getElementById('van_arm').checked && (document.getElementById('van_v').checked || document.getElementById('van_a').checked || document.getElementById('van_n').checked);

        tempEvalData = {
            name: name, cc: ccInput, pi: piInput,
            lkw: lkwInput ? new Date(lkwInput).toLocaleString('th-TH') : 'ไม่ระบุ',
            rawLkw: lkwInput,
            onset: onset, fmc: fmcInput || '-', 
            befast: { b: document.getElementById('befast_b').checked, e: document.getElementById('befast_e').checked, f: document.getElementById('befast_f').checked, a: document.getElementById('befast_a').checked, s: document.getElementById('befast_s').checked },
            van: { arm: document.getElementById('van_arm').checked, v: document.getElementById('van_v').checked, a: document.getElementById('van_a').checked, n: document.getElementById('van_n').checked },
            isLvo: isLvo, isFastTrack: isBeFastPositive, status: 'assessed'
        };

        if (!isBeFastPositive) { tempEvalData.status = 'not_qualify'; saveRecordToFirebase(); return; }
        if (!lkwInput) { alert('กรุณาระบุเวลา "Last Known Well"'); return; }

        let lkwTime = new Date(lkwInput);
        if (lkwTime.getFullYear() > 2400) lkwTime.setFullYear(lkwTime.getFullYear() - 543);
        
        let evalEndTime = new Date();
        if (fmcInput) {
            evalEndTime = new Date(lkwTime);
            let [fmcHr, fmcMin] = fmcInput.split(':');
            evalEndTime.setHours(parseInt(fmcHr), parseInt(fmcMin), 0, 0);
            if (evalEndTime < lkwTime) {
                evalEndTime.setDate(evalEndTime.getDate() + 1);
            }
        }

        const diffHours = (evalEndTime - lkwTime) / (1000 * 60 * 60);
        if (diffHours < 0) { alert("เวลาผิดพลาด: Last Known Well อยู่หลังเวลา FMC กรุณาตรวจสอบเวลาใหม่"); return; }

        let shouldActivate = false, alertMsg = "", alertClass = "bg-yellow-50 text-yellow-800 px-3 py-2 rounded-lg mb-3 font-semibold text-xs border border-yellow-200 shadow-sm";
        if (diffHours <= 4.5) {
            shouldActivate = true; alertMsg = "✅ อยู่ในกรอบเวลา 4.5 ชม.<br>(Activate Stroke Fast Track เพื่อพิจารณา rt-PA)";
            if (isLvo) { alertMsg += "<br><br>⚠️ VAN Positive: สงสัยหลอดเลือดสมองเส้นใหญ่อุดตัน (LVO)"; alertClass = "bg-red-50 text-red-800 px-3 py-2 rounded-lg mb-3 border border-red-200 shadow-sm"; }
        } else if (diffHours <= 24 && isLvo) {
            shouldActivate = true; alertMsg = "⚠️ เกิน 4.5 ชม. แต่ VAN Positive (สงสัย LVO)<br><br>➡️ Activate (พิจารณา EVT/Thrombectomy)"; alertClass = "bg-orange-50 text-orange-800 px-3 py-2 rounded-lg mb-3 border border-orange-200 shadow-sm";
        }

        if (shouldActivate) {
            if(window.activeDocId) {
                updateExistingAssessment();
            } else {
                document.getElementById('activationModal').classList.remove('hidden');
                const alertBox = document.getElementById('modalLvoAlert');
                alertBox.innerHTML = alertMsg; alertBox.className = alertClass; alertBox.classList.remove('hidden');
            }
        } else {
            alert("เกินเวลาที่กำหนดและไม่เข้าเกณฑ์ LVO");
            tempEvalData.status = 'not_qualify'; saveRecordToFirebase();
        }
    }

    async function updateExistingAssessment() {
        try {
            await updateDoc(doc(db, "stroke_patients", window.activeDocId), tempEvalData);
            alert("อัปเดตข้อมูลการประเมินสำเร็จ!");
            window.switchTab('action');
        } catch (error) { alert("เกิดข้อผิดพลาดในการอัปเดตประเมิน"); }
    }

    window.confirmActivation = async function() {
        document.getElementById('activationModal').classList.add('hidden');
        const activateTime = new Date().toTimeString().slice(0,5);
        const record = { ...tempEvalData, activateTime: activateTime, dateStr: new Date().toLocaleDateString('th-TH'), status: 'active', createdBy: window.currentUserEmail, vitals_timeline: [] };

        try {
            record.createdAt = serverTimestamp();
            const docRef = await addDoc(collection(db, "stroke_patients"), record);
            window.activeDocId = docRef.id;
            
            window.currentActiveDocId = docRef.id;
            localStorage.setItem('activeCaseId', docRef.id);

            alert("🚨 แจ้งศูนย์สั่งการเรียบร้อย!\n(สามารถบันทึกการรักษาและแชร์พิกัดต่อได้เลยครับ)");
            
            document.getElementById('activePatientName').innerText = `ผู้ป่วย: ${record.name}`;
            document.getElementById('activeTime').innerText = (record.activateTime || '-') + " น.";
            window.switchTab('action');
        } catch (error) { alert("เชื่อมต่อล้มเหลว"); }
    }

    async function saveRecordToFirebase() {
        const record = { ...tempEvalData, activateTime: '-', dateStr: new Date().toLocaleDateString('th-TH') };
        if(window.activeDocId) {
            await updateDoc(doc(db, "stroke_patients", window.activeDocId), record);
            alert("อัปเดตข้อมูลเรียบร้อย (ไม่เข้าเกณฑ์)");
        } else {
            record.createdAt = serverTimestamp();
            record.createdBy = window.currentUserEmail;
            await addDoc(collection(db, "stroke_patients"), record);
            alert("บันทึกเรียบร้อย (ไม่เข้าเกณฑ์)"); 
        }
        document.getElementById('strokeForm').reset();
        window.switchTab('dashboard');
    }

    window.resumeCase = function(docId) {
        const rec = window.allCases.find(c => c.id === docId);
        if(!rec) return;
        window.activeDocId = docId;
        window.currentActiveDocId = docId;
        localStorage.setItem('activeCaseId', docId);
        
        document.getElementById('patientName').value = rec.name || '';
        if(rec.rawLkw) document.getElementById('timeLkw').value = rec.rawLkw;
        document.getElementById('patientCC').value = rec.cc || '';
        document.getElementById('patientPI').value = rec.pi || '';
        document.getElementById('timeOnset').value = rec.onset || '';
        document.getElementById('timeFMC').value = rec.fmc || '';
        
        if(rec.befast) {
            document.getElementById('befast_b').checked = rec.befast.b;
            document.getElementById('befast_e').checked = rec.befast.e;
            document.getElementById('befast_f').checked = rec.befast.f;
            document.getElementById('befast_a').checked = rec.befast.a;
            document.getElementById('befast_s').checked = rec.befast.s;
        }
        if(rec.van) {
            document.getElementById('van_arm').checked = rec.van.arm;
            document.getElementById('van_v').checked = rec.van.v;
            document.getElementById('van_a').checked = rec.van.a;
            document.getElementById('van_n').checked = rec.van.n;
        }

        if(rec.interventions) {
            const v = rec.interventions.vitals;
            if(v) {
                document.getElementById('v_bp').value = v.bp !== '-' ? v.bp : '';
                document.getElementById('v_hr').value = v.hr !== '-' ? v.hr : '';
                document.getElementById('v_rr').value = v.rr !== '-' ? v.rr : '';
                document.getElementById('v_o2').value = v.o2 !== '-' ? v.o2 : '';
                document.getElementById('v_dtx').value = v.dtx !== '-' ? v.dtx : '';
                document.getElementById('v_pupill').value = v.pupil_l !== '-' ? v.pupil_l : '';
                document.getElementById('v_pupilr').value = v.pupil_r !== '-' ? v.pupil_r : '';
                
                document.getElementById('v_gcs_e').value = v.gcs?.e !== '-' ? v.gcs.e : '';
                document.getElementById('v_gcs_v').value = v.gcs?.v !== '-' ? v.gcs.v : '';
                document.getElementById('v_gcs_m').value = v.gcs?.m !== '-' ? v.gcs.m : '';
            }
            if(rec.interventions.motor) {
                const m = rec.interventions.motor;
                document.getElementById('m_ra').value = m.ra || '5';
                document.getElementById('m_la').value = m.la || '5';
                document.getElementById('m_rl').value = m.rl || '5';
                document.getElementById('m_ll').value = m.ll || '5';
            }
            const intv = rec.interventions;
            if(intv.ab_manage) {
                document.getElementById('chk_ab_manage').checked = intv.ab_manage.done;
                document.getElementById('val_ab_manage').value = intv.ab_manage.detail !== '-' ? intv.ab_manage.detail : '';
            }
            if(intv.iv) {
                document.getElementById('chk_iv').checked = intv.iv.done;
                document.getElementById('val_iv_rate').value = intv.iv.rate !== '-' ? intv.iv.rate : '';
            }
            if(intv.consult) {
                document.getElementById('chk_consult').checked = intv.consult.done;
                document.getElementById('val_consult').value = intv.consult.detail !== '-' ? intv.consult.detail : '';
            }
            if(intv.other) {
                document.getElementById('chk_other').checked = intv.other.done;
                document.getElementById('val_other').value = intv.other.detail !== '-' ? intv.other.detail : '';
            }
        } else {
            document.getElementById('interventionForm').reset();
        }

        document.getElementById('activePatientName').innerText = `ผู้ป่วย: ${rec.name}`;
        const activeTimeEl = document.getElementById('activeTime');
        if(activeTimeEl) activeTimeEl.innerText = (rec.activateTime || '-') + " น.";
        
        window.switchTab('assess');
    }

    window.saveAndShareLocation = async function() {
        if(!window.activeDocId) return;
        
        const v = {
            bp: document.getElementById('v_bp').value || '-', hr: document.getElementById('v_hr').value || '-', rr: document.getElementById('v_rr').value || '-', o2: document.getElementById('v_o2').value || '-', dtx: document.getElementById('v_dtx').value || '-', pupil_l: document.getElementById('v_pupill').value || '-', pupil_r: document.getElementById('v_pupilr').value || '-',
            gcs: { e: document.getElementById('v_gcs_e').value || '-', v: document.getElementById('v_gcs_v').value || '-', m: document.getElementById('v_gcs_m').value || '-' },
            motor: { ra: document.getElementById('m_ra').value, la: document.getElementById('m_la').value, rl: document.getElementById('m_rl').value, ll: document.getElementById('m_ll').value }
        };
        const intvData = {
            vitals: v,
            motor: v.motor,
            ab_manage: { done: document.getElementById('chk_ab_manage').checked, detail: document.getElementById('val_ab_manage').value || '-' },
            iv: { done: document.getElementById('chk_iv').checked, rate: document.getElementById('val_iv_rate').value || '-' },
            consult: { done: document.getElementById('chk_consult').checked, detail: document.getElementById('val_consult').value || '-' },
            other: { done: document.getElementById('chk_other').checked, detail: document.getElementById('val_other').value || '-' }
        };

        const btnShare = document.getElementById('btnShareLocation');
        const originalBtnHTML = btnShare.innerHTML;
        btnShare.innerHTML = '<i class="fas fa-spinner fa-spin mr-1.5"></i> กำลังดึงพิกัด...';
        btnShare.disabled = true;

        const pushDataToFirebase = async (lat, lng) => {
            try {
                await updateDoc(doc(db, "stroke_patients", window.activeDocId), { 
                    interventions: intvData, 
                    locationShared: true,
                    lat: lat,
                    lng: lng
                });
                alert("📍 บันทึกข้อมูลและแชร์พิกัด GPS สำเร็จ!");
                document.getElementById('interventionForm').reset();
                btnShare.innerHTML = originalBtnHTML;
                btnShare.disabled = false;
                window.switchTab('assess'); 
            } catch (error) { 
                alert("เกิดข้อผิดพลาดในการบันทึก"); 
                btnShare.innerHTML = originalBtnHTML;
                btnShare.disabled = false;
            }
        };

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => { pushDataToFirebase(position.coords.latitude, position.coords.longitude); },
                (error) => {
                    alert("ไม่สามารถดึงพิกัด GPS ได้ (กรุณาเปิด Location)");
                    pushDataToFirebase(null, null);
                },
                { enableHighAccuracy: true, timeout: 5000 }
            );
        } else {
            pushDataToFirebase(null, null);
        }
    }

    window.exportToCSV = function() {
        if(window.allCases.length === 0) { alert("ไม่มีข้อมูล"); return; }
        let csv = "\uFEFFชื่อ,CC,PI,Onset,FMC,Activate,Door,CT,Needle,ผลการรักษา,สถานะ\n";
        window.allCases.forEach(r => {
            let safeCC = r.cc ? r.cc.replace(/"/g, '""') : '';
            let safePI = r.pi ? r.pi.replace(/"/g, '""').replace(/\n/g, ' ') : '';
            let erOut = r.er_outcomes ? r.er_outcomes.join(' + ') : (r.er_outcome || '');
            
            csv += `"${r.name}","${safeCC}","${safePI}","${r.onset}","${r.fmc}","${r.activateTime}","${r.timeDoor||'-'}","${r.timeCT||'-'}","${r.timeNeedle||'-'}","${erOut}","${r.status}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Stroke_Data.csv`;
        document.body.appendChild(link); link.click(); document.body.removeChild(link);

    // ================= 🔄 REAL-TIME FIRESTORE LISTENER =================
    // 👉 ฟังก์ชันสำหรับเริ่มดึงข้อมูล (เรียกใช้เมื่อ Login สำเร็จแล้ว)
    function startListeningData() {
        if (unsubscribeSnapshot) return; // ป้องกันการดึงข้อมูลซ้ำ

        unsubscribeSnapshot = onSnapshot(query(collection(db, "stroke_patients"), orderBy("createdAt", "desc")), (snapshot) => {
            const historyList = document.getElementById('historyList');
            const activeList = document.getElementById('activeCasesList');
            if(!historyList || !activeList) return;
            
            historyList.innerHTML = ''; activeList.innerHTML = ''; window.allCases = [];
            
            let now = new Date();
            let todayStr = now.toLocaleDateString('th-TH');
            let currentMonth = now.getMonth();
            let currentYear = now.getFullYear();

            let dTotal = 0, dActive = 0, dStroke = 0, dLvo = 0;
            let monthActivatedCount = 0;
            let outs = { rtpa: 0, mt: 0, admit: 0, refer: 0, refused: 0, dead: 0, pending: 0 };
            let activeMarkerIds = [];

            let isAdmin = window.currentUserEmail && window.currentUserEmail.startsWith('admin');

            if (snapshot.empty) { 
                historyList.innerHTML = '<p class="text-center text-gray-500 py-4 text-xs">ยังไม่มีประวัติในระบบ</p>'; 
                activeList.innerHTML = '<p class="text-center text-[11px] text-slate-500 py-6 italic">ไม่มีเคสที่กำลังดำเนินการ</p>';
                return; 
            }

            snapshot.forEach((docSnap) => {
                const rec = { id: docSnap.id, ...docSnap.data() };
                window.allCases.push(rec);
                
                let canView = isAdmin || (rec.createdBy === window.currentUserEmail);

                // ตรวจสอบว่าเคสอยู่ในเดือนและปีปัจจุบันหรือไม่
                let recDate = rec.createdAt ? rec.createdAt.toDate() : null;
                let isCurrentMonth = false;
                if (recDate) {
                    isCurrentMonth = (recDate.getMonth() === currentMonth && recDate.getFullYear() === currentYear);
                } else if (rec.dateStr) {
                    let parts = rec.dateStr.split('/');
                    if (parts.length === 3) {
                        let m = parseInt(parts[1]) - 1;
                        isCurrentMonth = (m === currentMonth);
                    }
                }

                // 1. สถิติการ์ดด้านบน (สรุปรายวัน)
                if (rec.dateStr === todayStr && canView) {
                    dTotal++;
                    if (rec.isFastTrack) dStroke++;
                    if (rec.isLvo) dLvo++;
                    if (rec.status === 'active') dActive++;
                }

                // 2. สรุปผลการรักษา (ER Outcomes) และยอด Activate รวม เป็น "รายเดือนปัจจุบัน"
                if (isCurrentMonth && canView) {
                    if (rec.status === 'active' || rec.status === 'completed') {
                        monthActivatedCount++;
                    }

                    if (rec.status === 'completed' && rec.er_outcomes) {
                        rec.er_outcomes.forEach(out => {
                            if (outs[out] !== undefined) outs[out]++;
                        });
                    }
                }
                
                if(canView) {
                    let badgeHistory = '<span class="bg-gray-400 text-white text-[9px] px-1.5 py-0.5 rounded">ไม่เข้าเกณฑ์</span>';
                    let btnHistory = '';
                    if(rec.status === 'active') {
                        badgeHistory = '<span class="bg-red-600 text-white text-[9px] px-1.5 py-0.5 rounded animate-pulse">กำลังดำเนินการ</span>';
                        btnHistory = `
                            <button onclick="window.selectCaseToUpdate('${rec.id}')" class="mt-2 w-full bg-blue-50 text-blue-700 text-xs py-1.5 rounded border border-blue-200 font-bold transition hover:bg-blue-100"><i class="fas fa-heartbeat mr-1"></i> บันทึกสัญญาณชีพ / ข้อมูลเพิ่ม</button>
                            <button onclick="window.viewCase('${rec.id}')" class="mt-1 w-full bg-gray-50 text-gray-700 text-xs py-1.5 rounded border border-gray-200 font-bold transition hover:bg-gray-100"><i class="fas fa-print mr-1"></i> 📄 พิมพ์เอกสาร A4</button>
                        `;
                    } else if (rec.status === 'completed') {
                        badgeHistory = '<span class="bg-emerald-600 text-white text-[9px] px-1.5 py-0.5 rounded shadow-sm">ปิดเคสแล้ว</span>';
                        btnHistory = `<button onclick="window.viewCase('${rec.id}')" class="mt-2 w-full bg-gray-50 text-gray-700 text-xs py-1.5 rounded border border-gray-200 font-bold transition hover:bg-gray-100"><i class="fas fa-print mr-1"></i> 📄 พิมพ์เอกสาร A4</button>`;
                    }

                    historyList.innerHTML += `
                        <div class="bg-white p-3 md:p-3.5 rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition text-xs">
                            <div class="flex justify-between items-start mb-1.5"><span class="font-bold text-gray-800 text-xs md:text-sm">${rec.name}</span>${badgeHistory}</div>
                            <div class="text-[11px] text-gray-500 space-y-0.5"><p>Onset: <span class="font-medium text-gray-700">${rec.onset}</span> | FMC: <span class="font-medium text-gray-700">${rec.fmc}</span></p></div>
                            ${btnHistory}
                        </div>
                    `;

                    if(rec.status === 'active') {
                        const locStatus = rec.locationShared ? `<span class="text-green-400 text-[11px] font-medium"><i class="fas fa-map-marker-alt animate-bounce mr-1"></i> แชร์พิกัดแล้ว</span>` : `<span class="text-slate-500 text-[11px] italic">รอกู้ชีพแชร์พิกัด...</span>`;
                        
                        activeList.innerHTML += `
                        <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/60 shadow-sm flex flex-col justify-between items-start hover:bg-slate-700/40 transition">
                            <div class="w-full flex justify-between items-center mb-1">
                                <span class="font-bold text-xs text-slate-100">${rec.name}</span>
                                <span class="text-[9px] font-bold text-red-200 bg-red-900/50 px-1.5 py-0.5 rounded border border-red-700/50">Act: ${rec.activateTime} น.</span>
                            </div>
                            <div class="w-full flex justify-between items-center mt-1 border-t border-slate-700/40 pt-1.5">
                                ${locStatus}
                                <button onclick="window.openFinishModal('${rec.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-2.5 py-1 rounded transition font-bold shadow border border-emerald-400/30">
                                    <i class="fas fa-flag-checkered mr-1"></i> จบงาน
                                </button>
                            </div>
                        </div>`;

                        if(rec.locationShared && rec.lat && rec.lng) {
                            activeMarkerIds.push(rec.id);
                            if(map) {
                                if(markers[rec.id]) {
                                    markers[rec.id].setLatLng([rec.lat, rec.lng]);
                                } else {
                                    markers[rec.id] = L.marker([rec.lat, rec.lng], {icon: ambIcon})
                                        .addTo(map)
                                        .bindPopup(`<div class="text-center font-bold text-slate-800 text-xs">${rec.name}<br><span class="text-[10px] text-red-600">Activate: ${rec.activateTime} น.</span></div>`);
                                }
                            }
                        }
                    }
                }
            });

            if (window.currentActiveDocId) {
                const currentRec = window.allCases.find(c => c.id === window.currentActiveDocId);
                if (currentRec) {
                    renderVitalsLogs(currentRec.vitals_timeline || []);
                }
            }

            if(map) {
                Object.keys(markers).forEach(id => {
                    if(!activeMarkerIds.includes(id)) {
                        map.removeLayer(markers[id]);
                        delete markers[id];
                    }
                });
                const placeholder = document.getElementById('map-placeholder');
                if(placeholder) {
                    if(activeMarkerIds.length === 0) {
                        placeholder.innerHTML = `<i class="fas fa-map-pin text-lg mb-1 opacity-30 text-slate-400"></i><p class="text-slate-500 text-[11px] italic">ไม่มีพิกัดในระบบ (รอการแชร์)</p>`;
                        placeholder.style.display = 'flex';
                    } else {
                        placeholder.style.display = 'none';
                    }
                }
            }

            const dashTotal = document.getElementById('dash-total');
            if(dashTotal) {
                dashTotal.innerText = dTotal;
                document.getElementById('dash-stroke').innerText = dStroke;
                document.getElementById('dash-lvo').innerText = dLvo;
                document.getElementById('dash-active').innerText = dActive;
                
                const outMonthActivated = document.getElementById('out-month-activated');
                if (outMonthActivated) {
                    outMonthActivated.innerText = monthActivatedCount;
                }
                document.getElementById('out-rtpa').innerText = outs.rtpa;
                document.getElementById('out-mt').innerText = outs.mt;
                document.getElementById('out-admit').innerText = outs.admit;
                document.getElementById('out-refer').innerText = outs.refer;
                document.getElementById('out-refused').innerText = outs.refused;
                document.getElementById('out-dead').innerText = outs.dead;

                if(dActive === 0) activeList.innerHTML = '<p class="text-center text-[11px] text-slate-500 py-6 italic">ไม่มีเคสที่กำลังดำเนินการ</p>';
            }
        });
    }
</script>
